[package]
name = "uewlift"
version = "0.1.0"
edition = "2021"
description = "UEWASM tools: the lifter (x86/x86-64 machine code to C), the web server and relay, the game-file packager, table generators"

[dependencies]
iced-x86 = { version = "=1.22.0", default-features = false, features = ["std", "decoder", "instr_info", "op_code_info", "intel"] }
rayon = "1"
serde_json = "1"
regex = "1"
flate2 = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
aes = "0.9"
base64 = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
