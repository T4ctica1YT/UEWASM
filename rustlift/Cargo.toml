[package]
name = "uewlift"
version = "0.1.0"
edition = "2021"
description = "UEWASM lifter: x86/x86-64 machine code to C (optional fast replacement for the Python lifter)"

[dependencies]
iced-x86 = { version = "=1.22.0", default-features = false, features = ["std", "decoder", "instr_info", "op_code_info"] }
rayon = "1"
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
